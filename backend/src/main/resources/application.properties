server.port=8080

# Load local secrets when running from the backend directory.
spring.config.import=optional:file:.env[.properties]

# TMDB credentials stay on the backend and are supplied through the environment.
tmdb.api.key=${TMDB_API_KEY:}
tmdb.api.base-url=https://api.themoviedb.org/3

# Origin of the React development server.
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
